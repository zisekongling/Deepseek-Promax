# Gradle JVM 配置，强制使用 JDK 17 构建（Android Gradle Plugin 兼容性要求）
org.gradle.java.home=C:/Program Files/Java/jdk-17

# 开启 Gradle 守护进程与并行构建以加速构建
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin 编译器在 Gradle 进程内运行，避免 daemon 被沙箱限制
kotlin.compiler.execution.strategy=in-process

# Kotlin 代码风格
kotlin.code.style=official

# AndroidX 标记
android.useAndroidX=true
android.nonTransitiveRClass=true

# 项目路径含非 ASCII 字符（中文目录名），覆盖 AGP 路径检查以允许构建
android.overridePathCheck=true

# 系统代理配置（127.0.0.1:10808），用于下载 Gradle 依赖与distribution
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=10808
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=10808
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|10.*|192.168.*
